spring.application.name=tp_spring_grupal_test
# BD en memoria (H2) para que los tests no dependan de PostgreSQL
spring.datasource.url=jdbc:h2:mem:facturacion_${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS facturacion
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.test.database.replace=none
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=facturacion
spring.jpa.show-sql=false

# AFIP: valores dummy, los tests nunca llaman a AFIP
afip.cuit=20000000001
afip.keystore.path=classpath:certificado.pfx
afip.keystore.password=dummy
afip.wsaa.url=http://localhost:9/wsaa
afip.wsfe.url=http://localhost:9/wsfe

afip.condicion-iva-emisor=RESPONSABLE_INSCRIPTO
spring.jackson.deserialization.accept-float-as-int=false
